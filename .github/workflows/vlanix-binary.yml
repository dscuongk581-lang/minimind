name: VLANIX Binary Rust
on:
  push:
    branches: [vlanix-tiny]
    paths:
      - 'vlanix_binary/**'
      - '.github/workflows/vlanix-binary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.1 --profile minimal
      - run: cargo +1.85.1 test --manifest-path vlanix_binary/Cargo.toml --locked --offline
      - run: cargo +1.85.1 build --manifest-path vlanix_binary/Cargo.toml --locked --offline --bin parity_executor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python vlanix_binary/parity.py vlanix_binary/target/debug/parity_executor
