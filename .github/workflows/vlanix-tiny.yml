name: VLANIX Tiny CPU
on:
  push:
    branches: [vlanix-tiny]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: python -m unittest discover -s tests -p 'test_*tiny*.py' -v
        env:
          OMP_NUM_THREADS: '2'
      - run: python -m vlanix_tiny.tokenizer --corpus vlanix_tiny/data/tokenizer_smoke.jsonl --output /tmp/tiny-tokenizer.json
