name: VLANIX Tiny CPU
on:
  push:
    branches: [vlanix-tiny]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: bash vlanix_tiny/ci.sh
  output-objective:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_output_objective.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.output_learning
  task-separation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_task_separator.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.task_separation_learning
  protected-core:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_protected_core.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.protected_learning
  adaptive-core:
