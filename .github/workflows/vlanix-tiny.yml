name: VLANIX Tiny CPU
on:
  push:
    branches: [vlanix-tiny]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: bash vlanix_tiny/ci.sh
  output-objective:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_output_objective.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.output_learning
  task-separation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_task_separator.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.task_separation_learning
  protected-core:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_protected_core.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.protected_learning
  adaptive-core:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_adaptive_guard.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.adaptive_learning
  gradient-direction:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_gradient_direction.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.direction_learning
  readout-balance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_readout_balance.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.readout_balance_learning
  structured-readout:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_structured_readout.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.structured_readout_learning
  complete-rehearsal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_complete_rehearsal.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.complete_rehearsal_learning
  margin-stability:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44, 45]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_margin_learning.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.margin_stability_learning --seed ${{ matrix.seed }}
  learning-state:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44, 45]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_learning_state.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.learning_state_probe --seed ${{ matrix.seed }}
  consolidation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44, 45]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_consolidation.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.consolidation_learning --seed ${{ matrix.seed }}
  core-verification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44, 45]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_core_verification.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.core_verification_learning --seed ${{ matrix.seed }} --out core-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngc-core-verification-${{ matrix.seed }}
          path: core-candidate/
          retention-days: 7
          if-no-files-found: ignore
  subtraction-learning:
    if: github.event_name == 'workflow_dispatch'
    needs: [smoke, core-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44, 45]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - uses: actions/download-artifact@v4
        with:
          name: ngc-core-verification-${{ matrix.seed }}
          path: parent-core
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_subtraction.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.subtraction_learning --seed ${{ matrix.seed }} --parent parent-core --out sub-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngc-sub-candidate-${{ matrix.seed }}
          path: sub-candidate/
          retention-days: 7
          if-no-files-found: ignore
  core-consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44, 45]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.6
      - uses: actions/download-artifact@v4
        with:
          name: ngc-core-verification-${{ matrix.seed }}
          path: parent-core
          run-id: 45615004505
          github-token: ${{ github.token }}
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_tiny_core_consolidation.py' -v
      - run: OMP_NUM_THREADS=2 python -m vlanix_tiny.core_consolidation_learning --seed ${{ matrix.seed }} --parent parent-core --out consolidated-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngc-consolidated-core-${{ matrix.seed }}
          path: consolidated-core/
          retention-days: 7
          if-no-files-found: ignore
